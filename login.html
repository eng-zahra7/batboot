<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="بطبوط - تطبيق تعليمي تفاعلي للأطفال لتعلم العربية والإنجليزية والرياضيات">
    <title>بطبوط | تسجيل الدخول</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;700;800&display=swap">
    <link rel="stylesheet" href="css/main-style.css">
    <!-- نفس ملف التسجيل: يكتشف نموذج الدخول ويشغّل الجزء الخاص به -->
    <script src="JS/registration.js" defer></script>
</head>
<body>

    <!-- ===== الترويسة: الشعار فقط (لا توجد خطوات في صفحة الدخول) ===== -->
    <header class="site-header">
        <a href="main-page.html" class="logo" aria-label="الصفحة الرئيسية لبطبوط">
            <img src="rec/Glossy Kawaii Chick Head Sticker.png" alt="" width="48" height="48">
            <span class="logo-text">بطبوط</span>
        </a>
    </header>

    <!-- ===== المحتوى الرئيسي: نفس تخطيط صفحات التسجيل ===== -->
    <main class="register-page">

        <figure class="mascot">
            <img src="rec/Cheerful Backpack Duck Waving.png" alt="بطبوط يلوّح بيده ويرحّب بعودتك" width="320" height="400">
        </figure>

        <section class="register-box" aria-labelledby="login-title">
            <h1 id="login-title">أهلاً بعودتك!</h1>
            <p class="subtitle">سجّل الدخول لمتابعة رحلة التعلّم مع بطبوط</p>

            <!-- رسالة عامة للنموذج (مثل: البيانات غير صحيحة) يملؤها registration.js -->
            <p class="form-alert" id="login-alert" role="alert" hidden></p>

            <form id="login-form" class="register-form" action="login.php" method="post">

                <!-- اسم ولي الأمر -->
                <div class="form-group input-icon">
                    <label for="login-name" class="visually-hidden">اسم ولي الأمر</label>
                    <input type="text" id="login-name" name="parent_name"
                           placeholder="اسم ولي الأمر" maxlength="50"
                           autocomplete="name" required>
                    <span class="icon" aria-hidden="true">👤</span>
                </div>

                <!-- رقم الجوال أو البريد: حقل واحد يقبل الاثنين، ويعرف JavaScript نوعه من وجود @ -->
                <div class="form-group input-icon">
                    <label for="login-id" class="visually-hidden">رقم الجوال أو البريد الإلكتروني</label>
                    <input type="text" id="login-id" name="login_id"
                           placeholder="رقم الجوال أو البريد الإلكتروني" maxlength="100" dir="ltr"
                           autocomplete="username" autocapitalize="off" spellcheck="false" required>
                    <span class="icon" aria-hidden="true">📱</span>
                </div>

                <!-- كلمة السر -->
                <div class="form-group input-icon password-field">
                    <label for="login-password" class="visually-hidden">كلمة السر</label>
                    <input type="password" id="login-password" name="password"
                           placeholder="كلمة السر" maxlength="64"
                           autocomplete="current-password" required>
                    <button type="button" class="toggle-password" aria-controls="login-password"
                            aria-pressed="false" aria-label="إظهار كلمة السر">👁</button>
                </div>

                <button type="submit" class="btn-next">
                    تسجيل الدخول
                    <span aria-hidden="true">&larr;</span>
                </button>
            </form>

            <p class="auth-switch">ليس لديك حساب؟ <a href="register-parent.html">أنشئ حسابًا جديدًا</a></p>
        </section>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 بطبوط - تعلّم والعب</p>
    </footer>

</body>
</html>
