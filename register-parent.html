<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="بطبوط - تطبيق تعليمي تفاعلي للأطفال لتعلم العربية والإنجليزية والرياضيات">
    <title>بطبوط | بيانات ولي الأمر</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;700;800&display=swap">
    <link rel="stylesheet" href="css/main-style.css">
    <!-- ملف JavaScript واحد لصفحات التسجيل الثلاث: defer = يعمل بعد تحميل الصفحة -->
    <script src="js/registration.js" defer></script>
</head>
<body>

    <!-- ===== الترويسة: الشعار + مؤشر خطوات التسجيل ===== -->
    <header class="site-header">
        <a href="main-page.html" class="logo" aria-label="الصفحة الرئيسية لبطبوط">
            <img src="rec/Glossy Kawaii Chick Head Sticker.png" alt="" width="48" height="48">
            <span class="logo-text">بطبوط</span>
        </a>

        <nav class="steps" aria-label="خطوات التسجيل">
            <ol>
                <li class="step active" aria-current="step"><span class="visually-hidden">الخطوة 1: بيانات ولي الأمر</span></li>
                <li class="step"><span class="visually-hidden">الخطوة 2: بيانات الطفل</span></li>
                <li class="step"><span class="visually-hidden">الخطوة 3</span></li>
            </ol>
        </nav>
    </header>

    <!-- ===== المحتوى الرئيسي ===== -->
    <main class="register-page">

        <!-- صورة الشخصية (بطبوط) -->
        <figure class="mascot">
            <img src="rec/Cheerful Backpack Duck Waving.png" alt="بطبوط يلوّح بيده ويرحّب بولي الأمر" width="320" height="400">
        </figure>

        <!-- قسم النموذج -->
        <section class="register-box" aria-labelledby="parent-title">
            <h1 id="parent-title">مرحباً بك في بطبوط!</h1>
            <p class="subtitle">قبل أن نبدأ، نحتاج بعض المعلومات عن ولي الأمر</p>

            <form id="parent-form" class="register-form" action="php/register-parent.php" method="post">

                <!-- اسم ولي الأمر -->
                <div class="form-group input-icon">
                    <label for="parent-name" class="visually-hidden">اسم ولي الأمر</label>
                    <input type="text" id="parent-name" name="parent_name"
                           placeholder="اسم ولي الأمر" minlength="3" maxlength="50"
                           autocomplete="name" required>
                    <span class="icon" aria-hidden="true">👤</span>
                </div>

                <!-- رقم الجوال -->
                <div class="form-group input-icon">
                    <label for="parent-phone" class="visually-hidden">رقم الجوال</label>
                    <input type="tel" id="parent-phone" name="parent_phone"
                           placeholder="رقم الجوال (05xxxxxxxx)" pattern="05[0-9]{8}"
                           inputmode="numeric" maxlength="10" dir="ltr"
                           autocomplete="tel" required
                           title="أدخل رقم جوال من 10 أرقام يبدأ بـ 05">
                    <span class="icon" aria-hidden="true">📱</span>
                </div>

                <!-- البريد الإلكتروني -->
                <div class="form-group input-icon">
                    <label for="parent-email" class="visually-hidden">البريد الإلكتروني</label>
                    <input type="email" id="parent-email" name="parent_email"
                           placeholder="البريد الإلكتروني" maxlength="100" dir="ltr"
                           autocomplete="email" required>
                    <span class="icon" aria-hidden="true">✉️</span>
                </div>

                <!-- كلمة السر: نوع password يخفي الأحرف، وزر العين يُظهرها -->
                <div class="form-group input-icon password-field">
                    <label for="parent-password" class="visually-hidden">كلمة السر</label>
                    <input type="password" id="parent-password" name="parent_password"
                           placeholder="كلمة السر" minlength="8" maxlength="64"
                           autocomplete="new-password" aria-describedby="password-rules" required>
                    <button type="button" class="toggle-password" aria-controls="parent-password"
                            aria-pressed="false" aria-label="إظهار كلمة السر">👁</button>
                </div>

                <!-- شروط كلمة السر: registration.js يضع علامة ✓ على كل شرط يتحقق أثناء الكتابة -->
                <ul class="password-rules" id="password-rules" aria-label="شروط كلمة السر">
                    <li data-rule="length">8 أحرف على الأقل</li>
                    <li data-rule="letter">حرف واحد على الأقل</li>
                    <li data-rule="number">رقم واحد على الأقل</li>
                </ul>

                <!-- تأكيد كلمة السر: للتأكد من عدم وجود خطأ في الكتابة -->
                <div class="form-group input-icon password-field">
                    <label for="parent-password-confirm" class="visually-hidden">تأكيد كلمة السر</label>
                    <input type="password" id="parent-password-confirm" name="parent_password_confirm"
                           placeholder="أعد كتابة كلمة السر" maxlength="64"
                           autocomplete="new-password" required>
                    <button type="button" class="toggle-password" aria-controls="parent-password-confirm"
                            aria-pressed="false" aria-label="إظهار كلمة السر">👁</button>
                </div>

                <!-- صلة القرابة -->
                <fieldset class="form-group choice-group relation-group">
                    <legend class="group-title">صلة القرابة بالطفل</legend>

                    <label class="choice">
                        <input type="radio" name="relation" value="mother" required>
                        <span>أم</span>
                    </label>
                    <label class="choice">
                        <input type="radio" name="relation" value="father">
                        <span>أب</span>
                    </label>
                    <label class="choice">
                        <input type="radio" name="relation" value="sister">
                        <span>أخت</span>
                    </label>
                    <label class="choice">
                        <input type="radio" name="relation" value="brother">
                        <span>أخ</span>
                    </label>
                    <label class="choice">
                        <input type="radio" name="relation" value="other" id="relation-other">
                        <span>أخرى</span>
                    </label>

                    <!-- يظهر هذا الحقل فقط عند اختيار "أخرى" (يتحكم به registration.js) -->
                    <div class="form-group other-relation">
                        <label for="relation-other-text">حدّد صلة القرابة</label>
                        <input type="text" id="relation-other-text" name="relation_other"
                               placeholder="مثال: جدة، خال، عمة" maxlength="30">
                    </div>
                </fieldset>

                <!-- زر التالي -->
                <button type="submit" class="btn-next">
                    التالي
                    <span aria-hidden="true">&larr;</span>
                </button>

            </form>

            <!-- لمن لديه حساب مسبقًا -->
            <p class="auth-switch">لديك حساب؟ <a href="login.html">سجّل الدخول</a></p>
        </section>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 بطبوط - تعلّم والعب</p>
    </footer>

</body>
</html>
