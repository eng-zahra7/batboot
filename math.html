<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="دروس الرياضيات للأطفال في بطبوط: الأرقام والجمع والطرح">
    <title>بطبوط | الرياضيات</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;700;800&display=swap">
    <link rel="stylesheet" href="css/main-style.css">
    <link rel="stylesheet" href="css/math.css">
    <script src="js/math.js" defer></script>
</head>
<body class="math-page">

    <!-- مجموعة الأيقونات (SVG) -->
    <svg class="svg-sprite" width="0" height="0" aria-hidden="true" focusable="false">
        <defs>
            <symbol id="i-calc" viewBox="0 0 64 64">
                <rect x="3" y="3" width="58" height="58" rx="14" fill="#fff" stroke="#cfe3f7" stroke-width="2"/>
                <rect x="8" y="8" width="23" height="23" rx="7" fill="#2f8cf0"/>
                <rect x="33" y="8" width="23" height="23" rx="7" fill="#ffc727"/>
                <rect x="8" y="33" width="23" height="23" rx="7" fill="#ef4b4b"/>
                <rect x="33" y="33" width="23" height="23" rx="7" fill="#4aa8f5"/>
                <g stroke="#fff" stroke-width="4" stroke-linecap="round" fill="none">
                    <path d="M19.5 14v11M14 19.5h11"/>
                    <path d="M39 19.5h11"/>
                    <path d="M14.5 39.5l10 10M24.5 39.5l-10 10"/>
                    <path d="M39 44.5h11"/>
                </g>
                <g fill="#fff"><circle cx="44.5" cy="38.5" r="2.4"/><circle cx="44.5" cy="50.5" r="2.4"/></g>
            </symbol>
            <symbol id="i-plus-tile" viewBox="0 0 120 100">
                <rect x="4" y="4" width="112" height="92" rx="30" fill="#fff"/>
                <rect x="10" y="10" width="100" height="80" rx="26" fill="#1f7bf5"/>
                <path d="M60 28v44M38 50h44" stroke="#fff" stroke-width="14" stroke-linecap="round"/>
            </symbol>
            <symbol id="i-minus-tile" viewBox="0 0 120 100">
                <rect x="4" y="4" width="112" height="92" rx="30" fill="#fff"/>
                <rect x="10" y="10" width="100" height="80" rx="26" fill="#f0489a"/>
                <path d="M36 50h48" stroke="#fff" stroke-width="14" stroke-linecap="round"/>
            </symbol>
        </defs>
    </svg>

    <!-- ===== الترويسة: الشعار + القائمة + البحث والحساب ===== -->
    <header class="site-header">
        <a href="main-page.html" class="logo" aria-label="الصفحة الرئيسية لبطبوط">
            <img src="rec/Glossy Kawaii Chick Head Sticker.png" alt="" width="48" height="48">
            <span class="logo-text">بطبوط</span>
        </a>

        <nav class="main-nav" aria-label="القائمة الرئيسية">
            <ul>
                <li><a href="main-page.html">الرئيسية</a></li>
                <li><a href="achievements.html">إنجازاتي</a></li>
            </ul>
        </nav>

        <div class="header-actions">
            <button type="button" class="icon-btn" aria-label="بحث">
                <span aria-hidden="true">🔍</span>
            </button>
            <a href="profile.html" class="avatar" aria-label="حسابي">
                <span aria-hidden="true">🧒</span>
            </a>
        </div>
    </header>

    <main class="math-main">
        <section class="math-card" aria-labelledby="math-title">

            <!-- زر الرجوع -->
            <a href="main-page.html" class="subject-btn back-btn" aria-label="الرجوع إلى الصفحة الرئيسية"><span aria-hidden="true">&larr;</span></a>

            <header class="math-head">
                <h1 id="math-title" class="math-title">الرياضيات
                    <svg class="math-title-icon" width="76" height="76" aria-hidden="true"><use href="#i-calc"/></svg>
                </h1>
                <p class="subtitle">اختر درسًا لتبدأ التعلم</p>
            </header>

            <!--
                كل بطاقة درس مستقلة. لاحقًا يملأ PHP السمات التالية من قاعدة البيانات:
                data-lesson-id, data-subject-id, data-child-id, data-completion-status,
                data-progress-percentage, data-stars-earned
                الروابط الحالية مؤقتة.
            -->
            <ul class="lesson-grid" id="math_lessons">
                <li>
                    <a href="numbers.html" class="lesson-card lesson-numbers" data-lesson-id="numbers" data-subject-id="math">
                        <span class="lesson-icon digits" aria-hidden="true"><span class="d1">1</span><span class="d2">2</span><span class="d3">3</span></span>
                        <h2 class="lesson-name">الأرقام</h2>
                    </a>
                </li>
                <li>
                    <a href="addition.html" class="lesson-card lesson-addition" data-lesson-id="addition" data-subject-id="math">
                        <svg class="lesson-icon" width="130" height="108" aria-hidden="true"><use href="#i-plus-tile"/></svg>
                        <h2 class="lesson-name">الجمع</h2>
                    </a>
                </li>
                <li>
                    <a href="subtraction.html" class="lesson-card lesson-subtraction" data-lesson-id="subtraction" data-subject-id="math">
                        <svg class="lesson-icon" width="130" height="108" aria-hidden="true"><use href="#i-minus-tile"/></svg>
                        <h2 class="lesson-name">الطرح</h2>
                    </a>
                </li>
            </ul>

            <figure class="math-mascot">
                <img src="rec/Cheerful Duckling with Calculator.png" alt="بطبوط بقبعة زرقاء يحمل آلة حاسبة" width="320" height="400">
            </figure>
        </section>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 بطبوط - تعلّم والعب</p>
    </footer>

</body>
</html>
