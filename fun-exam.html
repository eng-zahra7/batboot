    <header class="site-header">
        <a href="main-page.html" class="logo" aria-label="الصفحة الرئيسية لبطبوط">

    <!--
        data-* = نقاط الربط مع PHP. يملؤها JavaScript عند انتهاء الاختبار:
        نتيجة كل مادة من 3، والمجموع من 9، وتاريخ الاختبار.
    -->
    <main class="quiz-main"
          data-child-id=""
          data-arabic-score=""
          data-english-score=""
          data-math-score=""
          data-total-score=""
          data-test-date="">

        <section class="quiz-card" aria-live="polite">

            <!-- ===== 1) شاشة البداية ===== -->
            <div class="quiz-screen quiz-intro" id="screen-intro">
                <img class="intro-mascot" src="rec/Cheerful Duckling Sticker with Pencil.png" alt="بطبوط يحمل قلمًا ومستعد للعب" width="220" height="260">
                <h1 class="quiz-title">لنتعرّف على مستواك!</h1>
                <p class="quiz-subtitle">9 أسئلة قصيرة وممتعة، وبعدها أخبرك من أين نبدأ.</p>

                <ul class="subject-chips" aria-label="مواد الاختبار">
                    <li class="subject-chip chip-arabic"><span class="chip-icon" aria-hidden="true">أ</span> اللغة العربية</li>
                    <li class="subject-chip chip-english"><span class="chip-icon" aria-hidden="true">A</span> English</li>
                    <li class="subject-chip chip-math"><span class="chip-icon" aria-hidden="true">1</span> الرياضيات</li>
                </ul>

                <button type="button" class="btn-next quiz-start" id="start-btn">
                    هيا نبدأ
                    <span aria-hidden="true">&larr;</span>
                </button>
            </div>

            <!-- ===== 2) شاشة السؤال (يملؤها JavaScript) ===== -->
            <div class="quiz-screen quiz-question" id="screen-question" hidden>

                <div class="quiz-top">
                    <span class="subject-badge" id="subject-badge"></span>
                    <p class="quiz-counter" id="quiz-counter"></p>
                    <button type="button" class="icon-btn mute-btn" id="mute-btn" aria-pressed="false" aria-label="كتم الأصوات">
                        <span aria-hidden="true">🔊</span>
                    </button>
                </div>

                <!-- نقاط التقدم: نقطة لكل سؤال بلون مادته -->
                <ol class="quiz-dots" id="quiz-dots" aria-label="تقدّم الاختبار"></ol>

                <!-- بطبوط يقرأ السؤال -->
                <div class="quiz-prompt">
                    <img class="prompt-avatar" src="rec/Glossy Kawaii Chick Head Sticker.png" alt="" width="64" height="64">
                    <div class="prompt-bubble">
                        <h2 class="prompt-text" id="prompt-text"></h2>
                        <p class="prompt-hint" id="prompt-hint" hidden></p>
                    </div>
                    <button type="button" class="sound-btn prompt-sound" id="prompt-sound" aria-label="استمع إلى السؤال">
                        <svg width="26" height="26" aria-hidden="true"><use href="#i-speaker"/></svg>
                    </button>
                </div>

                <!-- الصورة أو العدّ أو المسألة -->
                <div class="quiz-visual" id="quiz-visual"></div>

                <!-- الإجابات -->
                <div class="quiz-answers" id="quiz-answers"></div>

                <p class="quiz-feedback" id="quiz-feedback" hidden></p>

                <button type="button" class="btn-next quiz-next" id="next-btn" hidden>
                    <span id="next-label">التالي</span>
                    <span aria-hidden="true">&larr;</span>
                </button>

                <!-- طبقة النجوم المتطايرة عند الإجابة الصحيحة -->
                <div class="confetti" id="confetti" aria-hidden="true"></div>
            </div>

            <!-- ===== 3) شاشة النتيجة ===== -->
            <div class="quiz-screen quiz-result" id="screen-result" hidden>
                <img class="intro-mascot" src="rec/Cheerful Duckling Sticker with Pencil.png" alt="" width="200" height="240">
                <h2 class="quiz-title" id="result-title">أحسنت يا بطل!</h2>
                <p class="result-total" id="result-total"></p>
                <p class="result-stars" id="result-stars" role="img"></p>

                <!-- نتيجة كل مادة مع التوصية -->
                <ul class="subject-results" id="subject-results"></ul>

                <div class="result-actions">
                    <a href="main-page.html" class="btn-next quiz-start" id="go-learn">
                        ابدأ التعلّم
                        <span aria-hidden="true">&larr;</span>
                    </a>
                    <button type="button" class="btn-edit" id="retry-btn">
                        <span aria-hidden="true">↺</span>
                        أعد الاختبار
                    </button>
                </div>

                <!-- جاهز لمرحلة PHP: يملؤه JavaScript بالنتائج بصيغة JSON ثم يُرسل لحفظها -->
                <form id="result-form" action="placement.php" method="post" hidden>
                    <input type="hidden" name="results" id="results-input" value="">
                </form>
            </div>
        </section>
    </main>
